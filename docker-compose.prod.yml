# Production stack. Put secrets into a git-ignored .env.prod next to this file:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build --wait
# Images are built from docker/php/Dockerfile (targets "prod" and "nginx") or pulled via APP_IMAGE / NGINX_IMAGE.
x-app: &app
  image: ${APP_IMAGE:-family-finance:latest}
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  environment:
    APP_ENV: prod
    APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
    DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-family_finance}?serverVersion=16&charset=utf8
    MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
    REDIS_URL: redis://redis:6379
    MAILER_DSN: ${MAILER_DSN:-null://null}
    MAILER_FROM: ${MAILER_FROM:-noreply@family-finance.local}
    DEFAULT_URI: ${APP_URL:-http://localhost}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
    TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}
  volumes:
    - uploads:/var/www/html/var/uploads
  restart: unless-stopped

services:
  app:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M"]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "messenger:consume"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: ${NGINX_IMAGE:-family-finance-nginx:latest}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_finance}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads:
