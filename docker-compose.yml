# Development stack. Start everything with `make up`.
x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: family-finance-dev
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  environment:
    APP_ENV: dev
    DATABASE_URL: postgresql://app:secret@db:5432/family_finance?serverVersion=16&charset=utf8
    MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
    REDIS_URL: redis://redis:6379
    MAILER_DSN: smtp://mailpit:1025
    DEFAULT_URI: http://localhost:${APP_PORT:-8080}

services:
  app:
    <<: *php
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *php
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "-vv"]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "messenger:consume"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: family_finance
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "family_finance"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vendor:
  postgres_data:
  redis_data:
